services:
  postgres:
    image: postgres:17
    container_name: digital-wallet-postgres
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: digital_wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d digital_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: digital-wallet-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: wallet
      RABBITMQ_DEFAULT_PASS: wallet
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: digital-wallet-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: wallet-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Fixes the issuer ("iss") of every token, whatever address the caller used to reach Keycloak.
      KC_HOSTNAME: http://localhost:8081
      # Containers reach Keycloak at keycloak:8080 for keys and token calls. Their URLs must use that address,
      # while the issuer stays fixed by KC_HOSTNAME.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Read by the realm import (infra/keycloak/realm-digital-wallet.json), so the secret is not in the repository.
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET}
      # Read by the realm import: the secret of the client that creates user accounts through the Admin API.
      REGISTRAR_CLIENT_SECRET: ${REGISTRAR_CLIENT_SECRET}
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  api:
    build: .
    container_name: digital-wallet-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=digital_wallet;Username=wallet;Password=wallet"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "wallet"
      RabbitMq__Password: "wallet"
      # The issuer must match the token's "iss" (KC_HOSTNAME); the metadata is fetched over the internal network.
      Auth__Authority: "http://localhost:8081/realms/digital-wallet"
      Auth__MetadataAddress: "http://keycloak:8080/realms/digital-wallet/.well-known/openid-configuration"
      Auth__Audience: "digital-wallet-api"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started

  bff:
    build:
      context: .
      dockerfile: src/DigitalWallet.Bff/Dockerfile
    container_name: digital-wallet-bff
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Keycloak__TokenEndpoint: "http://keycloak:8080/realms/digital-wallet/protocol/openid-connect/token"
      Keycloak__LogoutEndpoint: "http://keycloak:8080/realms/digital-wallet/protocol/openid-connect/logout"
      Keycloak__ClientId: "digital-wallet-bff"
      Keycloak__ClientSecret: ${BFF_CLIENT_SECRET}
      Keycloak__RegistrarClientId: "digital-wallet-registrar"
      Keycloak__RegistrarClientSecret: ${REGISTRAR_CLIENT_SECRET}
      Keycloak__AdminBaseUrl: "http://keycloak:8080/admin/realms/digital-wallet"
      # /api/* is forwarded to the API over the internal network.
      Api__BaseUrl: "http://api:8080"
    depends_on:
      keycloak:
        condition: service_started

  ui:
    build: ./ui
    container_name: digital-wallet-ui
    ports:
      - "3000:3000"
    environment:
      # The browser only talks to this server. /bff/* and /api/* are rewritten to the BFF on the internal network.
      BFF_URL: "http://bff:8080"
      # Accounts per page on the home and inactive accounts pages (default 5).
      NEXT_PUBLIC_ACCOUNTS_PAGE_SIZE: "${NEXT_PUBLIC_ACCOUNTS_PAGE_SIZE:-5}"
      # Changes made on the Windows host may not reach the container through the volume, so the dev server polls.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./ui:/app
      # Keeps the container's dependencies and build cache out of the host folder.
      - ui-node-modules:/app/node_modules
      - ui-next:/app/.next
    depends_on:
      - bff

volumes:
  pgdata:
  rabbitmq-data:
  ui-node-modules:
  ui-next:
